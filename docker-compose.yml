version: "3.9"

services:
  # ─── Database ───────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: medflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medflow
      POSTGRES_PASSWORD: medflow
      POSTGRES_DB: medflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medflow -d medflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache / Message Broker ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Object Storage ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: medflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: medflow
      MINIO_ROOT_PASSWORD: medflow123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO bucket init
  minio-init:
    image: minio/mc:latest
    container_name: medflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 medflow medflow123;
      mc mb --ignore-existing local/medflow-documents;
      mc anonymous set download local/medflow-documents;
      echo 'MinIO bucket initialized';
      "
    restart: "no"

  # ─── Backend API ─────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: medflow-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://medflow:medflow@postgres:5432/medflow
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MOCK_AI_MODE: ${MOCK_AI_MODE:-true}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: medflow
      S3_SECRET_KEY: medflow123
      S3_BUCKET_NAME: medflow-documents
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Celery Worker ───────────────────────────────────────────
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: medflow-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://medflow:medflow@postgres:5432/medflow
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MOCK_AI_MODE: ${MOCK_AI_MODE:-true}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: medflow
      S3_SECRET_KEY: medflow123
      S3_BUCKET_NAME: medflow-documents
      ENVIRONMENT: development
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  # ─── Frontend ────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: medflow-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  minio_data:
